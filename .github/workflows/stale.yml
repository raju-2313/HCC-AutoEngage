name: Close stale issues

on:
  schedule:
    - cron: "0 0 * * *"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest

    steps:
      - name: Mark and close stale issues
        uses: actions/stale@v9
        with:
          days-before-stale: 30
          days-before-close: 7
          stale-issue-message: "This issue is stale because it has been open for 30 days with no activity. It will be closed in 7 days if no further activity occurs."
          close-issue-message: "This issue was closed because it has been stale for 7 days with no activity."
